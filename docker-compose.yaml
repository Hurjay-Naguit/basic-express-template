services:
  server:
    build: .
    ports:
      - "${PORT}:5000"
    # depends_on:
    #   - redis
    # environment:
    #   - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./package.json

